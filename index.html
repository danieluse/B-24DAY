<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С днем рождения, Алина!</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            font-family: 'Arial', sans-serif;
            color: white;
            touch-action: manipulation; /* Убирает задержку клика на телефонах */
        }

        /* Адаптивный заголовок */
        h1 {
            font-size: 8vw; /* Размер зависит от ширины экрана */
            max-size: 60px; /* Ограничение для ПК */
            color: #ff4da6;
            text-shadow: 0 0 10px #ff4da6, 0 0 30px #ff4da6;
            margin-bottom: 5vh;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }

        /* Адаптивное сердце */
        .bigheart {
            font-size: 25vw;
            max-font-size: 150px;
            animation: beat 1.2s infinite ease-in-out;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            -webkit-tap-highlight-color: transparent; /* Убирает синюю рамку при клике на Android/iOS */
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Искры */
        .sparkle {
            position: absolute;
            top: -50px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Пожелания */
        .wish {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 4vw;
            max-font-size: 20px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
        }

        /* Медиа-запросы для точной настройки */
        @media (min-width: 768px) {
            h1 { font-size: 50px; }
            .bigheart { font-size: 130px; }
            .wish { font-size: 18px; }
        }

        .hint {
            position: absolute;
            bottom: 5vh;
            font-size: 12px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1 id="text"></h1>
    <div class="bigheart" id="heart">❤️</div>
    <div class="hint">Нажми на экран</div>

    <script>
        const message = "А ТЬФЫ ЯЭХТУЬЧН,ОЪЧЬО! 💖";
        let index = 0;
        const wishes = ["Мечтай", "Сияй", "Люби", "Счастья", "Улыбайся", "Радуйся"];

        // Печать текста
        function type() {
            if (index < message.length) {
                document.getElementById("text").innerHTML += message.charAt(index);
                index++;
                setTimeout(type, 100);
            }
        }
        window.onload = type;

        // Искры
        function createSparkle() {
            const s = document.createElement("div");
            s.className = "sparkle";
            s.innerHTML = ["✨", "🌸", "⭐", "💖"][Math.floor(Math.random() * 4)];
            s.style.left = Math.random() * 100 + "vw";
            s.style.fontSize = Math.random() * 20 + 15 + "px";
            s.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 5000);
        }
        setInterval(createSparkle, 500);

        // Плавающие слова (располагаем так, чтобы не перекрывали центр)
        wishes.forEach((word) => {
            const w = document.createElement("div");
            w.className = "wish";
            w.innerHTML = word;
            w.style.left = Math.random() * 70 + 15 + "vw";
            w.style.top = Math.random() * 70 + 15 + "vh";
            document.body.appendChild(w);
        });

        // Эффект при клике (работает и на десктопе, и на тачскрине)
        function explode(x, y) {
            for (let i = 0; i < 15; i++) {
                const p = document.createElement("div");
                p.style.position = "fixed";
                p.style.left = x + "px";
                p.style.top = y + "px";
                p.innerHTML = "🌸";
                p.style.fontSize = "20px";
                p.style.pointerEvents = "none";
                p.style.zIndex = "100";
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 100 + 50;

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' });

                setTimeout(() => p.remove(), 800);
            }
        }

        // Слушаем клики и касания
        window.addEventListener('mousedown', (e) => explode(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
            explode(e.touches[0].clientX, e.touches[0].clientY);
        });
    </script>
</body>
</html>
